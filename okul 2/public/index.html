<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avni Tokur Eğitim Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app"></div>

    <script>
        var defaultUsers = [
            { id: 1, username: 'admin', password: '123', role: 'admin', name: 'Yönetici' },
            { id: 2, username: 'ogretmen', password: '123', role: 'teacher', name: 'Ahmet Yılmaz' },
            { id: 3, username: 'ogrenci', password: '123', role: 'student', name: 'Ali Demir' }
        ];

        var defaultSchedules = [
            { id: 1, day: 'Pazartesi', time: '09:00 - 10:30', class: '10-A', subject: 'Matematik', teacher: 'Ahmet Yılmaz' },
            { id: 2, day: 'Salı', time: '10:45 - 12:15', class: '11-B', subject: 'Fizik', teacher: 'Mehmet Kaya' }
        ];

        var defaultPayments = [
            { id: 1, studentName: 'Ali Demir', amount: 1500, date: '2023-10-01', status: 'Ödendi' },
            { id: 2, studentName: 'Ayşe Can', amount: 2000, date: '2023-10-05', status: 'Bekliyor' }
        ];

        function getData(key, fallback) {
            var data = localStorage.getItem(key);
            return data ? JSON.parse(data) : fallback;
        }

        function saveData(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function initApp() {
            if (!localStorage.getItem('users')) saveData('users', defaultUsers);
            if (!localStorage.getItem('schedules')) saveData('schedules', defaultSchedules);
            if (!localStorage.getItem('payments')) saveData('payments', defaultPayments);

            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                showDashboard(currentUser);
            } else {
                showLoginForm();
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            var usernameInput = document.getElementById('login-username').value.trim();
            var passwordInput = document.getElementById('login-password').value.trim();

            var users = getData('users', defaultUsers);
            var user = users.find(function(u) {
                return u.username === usernameInput && u.password === passwordInput;
            });

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                showDashboard(user);
            } else {
                alert('Kullanıcı adı veya şifre hatalı!\nKullanıcı adı: admin\nŞifre: 123');
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            initApp();
        }

        function showLoginForm() {
            var app = document.getElementById('app');
            app.innerHTML = 
                '<div class="login-container">' +
                    '<form onsubmit="handleLogin(event)" class="login-card">' +
                        '<h2>Avni Tokur Eğitim</h2>' +
                        '<p>Lütfen giriş yapın</p>' +
                        '<div class="form-group">' +
                            '<label>Kullanıcı Adı</label>' +
                            '<input type="text" id="login-username" required autocomplete="off">' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label>Şifre</label>' +
                            '<input type="password" id="login-password" type="password" required autocomplete="off">' +
                        '</div>' +
                        '<button type="submit" class="btn-submit">Giriş Yap</button>' +
                    '</form>' +
                '</div>';
        }

        function showDashboard(user) {
            var app = document.getElementById('app');
            app.innerHTML = 
                '<header class="navbar">' +
                    '<h2>Avni Tokur Eğitim Paneli</h2>' +
                    '<div class="user-info">' +
                        '<span>Hoşgeldiniz, <strong>' + user.name + '</strong></span>' +
                        '<button onclick="handleLogout()" class="btn-logout">Çıkış Yap</button>' +
                    '</div>' +
                '</header>' +
                '<div class="container">' +
                    '<nav class="sidebar">' +
                        '<button onclick="showTab(\'schedules\')" id="btn-schedules" class="tab-btn active">Ders Programı</button>' +
                        '<button onclick="showTab(\'payments\')" id="btn-payments" class="tab-btn">Ödemeler</button>' +
                    '</nav>' +
                    '<main class="content">' +
                        '<div id="tab-schedules" class="tab-content" style="display:block;">' +
                            '<div class="section-header">' +
                                '<h3>Ders Programları</h3>' +
                                (user.role === 'admin' ? '<button onclick="openScheduleModal()" class="btn-add">+ Ders Ekle</button>' : '') +
                            '</div>' +
                            '<div id="schedule-list"></div>' +
                        '</div>' +
                        '<div id="tab-payments" class="tab-content" style="display:none;">' +
                            '<div class="section-header">' +
                                '<h3>Ödeme Yönetimi</h3>' +
                                (user.role === 'admin' ? '<button onclick="openPaymentModal()" class="btn-add">+ Ödeme Ekle</button>' : '') +
                            '</div>' +
                            '<div class="stats-cards">' +
                                '<div class="card card-green"><h4>Toplam Tahsilat</h4><p id="stat-paid">0 TL</p></div>' +
                                '<div class="card card-orange"><h4>Bekleyen Ödemeler</h4><p id="stat-pending">0 TL</p></div>' +
                                '<div class="card card-blue"><h4>Genel Toplam</h4><p id="stat-total">0 TL</p></div>' +
                            '</div>' +
                            '<div id="payment-list"></div>' +
                        '</div>' +
                    '</main>' +
                '</div>';

            loadSchedules();
            loadPayments();
        }

        function showTab(tabName) {
            document.getElementById('tab-schedules').style.display = tabName === 'schedules' ? 'block' : 'none';
            document.getElementById('tab-payments').style.display = tabName === 'payments' ? 'block' : 'none';

            document.getElementById('btn-schedules').className = 'tab-btn' + (tabName === 'schedules' ? ' active' : '');
            document.getElementById('btn-payments').className = 'tab-btn' + (tabName === 'payments' ? ' active' : '');
        }

        function loadSchedules() {
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            var schedules = getData('schedules', defaultSchedules);
            var container = document.getElementById('schedule-list');

            var html = '<table class="data-table"><thead><tr><th>Gün</th><th>Saat</th><th>Sınıf</th><th>Ders</th><th>Öğretmen</th>' +
                       (currentUser.role === 'admin' ? '<th>İşlem</th>' : '') +
                       '</tr></thead><tbody>';

            schedules.forEach(function(item) {
                html += '<tr><td>' + item.day + '</td><td>' + item.time + '</td><td>' + item.class + '</td><td>' + item.subject + '</td><td>' + item.teacher + '</td>' +
                        (currentUser.role === 'admin' ? '<td><button onclick="deleteSchedule(' + item.id + ')" class="btn-delete">Sil</button></td>' : '') +
                        '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function deleteSchedule(id) {
            if (confirm('Bu ders kaydını silmek istediğinize emin misiniz?')) {
                var schedules = getData('schedules', defaultSchedules).filter(function(s) { return s.id !== id; });
                saveData('schedules', schedules);
                loadSchedules();
            }
        }

        function openScheduleModal() {
            var day = prompt("Gün:");
            var time = prompt("Saat (Örn: 09:00 - 10:00):");
            var className = prompt("Sınıf:");
            var subject = prompt("Ders Adı:");
            var teacher = prompt("Öğretmen:");

            if (day && time && subject) {
                var schedules = getData('schedules', defaultSchedules);
                schedules.push({ id: Date.now(), day: day, time: time, class: className, subject: subject, teacher: teacher });
                saveData('schedules', schedules);
                loadSchedules();
            }
        }

        function loadPayments() {
            var currentUser = JSON.parse(localStorage.getItem('currentUser'));
            var payments = getData('payments', defaultPayments);
            var container = document.getElementById('payment-list');

            var totalPaid = 0;
            var totalPending = 0;

            var html = '<table class="data-table"><thead><tr><th>Öğrenci Adı</th><th>Tutar</th><th>Tarih</th><th>Durum</th>' +
                       (currentUser.role === 'admin' ? '<th>İşlem</th>' : '') +
                       '</tr></thead><tbody>';

            payments.forEach(function(item) {
                var amount = Number(item.amount);
                if (item.status === 'Ödendi') totalPaid += amount;
                else totalPending += amount;

                html += '<tr><td>' + item.studentName + '</td><td>' + amount + ' TL</td><td>' + item.date + '</td>' +
                        '<td><span class="badge ' + (item.status === 'Ödendi' ? 'bg-success' : 'bg-warning') + '">' + item.status + '</span></td>' +
                        (currentUser.role === 'admin' ? '<td><button onclick="togglePaymentStatus(' + item.id + ')" class="btn-edit">Durum Değiştir</button><button onclick="deletePayment(' + item.id + ')" class="btn-delete">Sil</button></td>' : '') +
                        '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            document.getElementById('stat-paid').innerText = totalPaid + ' TL';
            document.getElementById('stat-pending').innerText = totalPending + ' TL';
            document.getElementById('stat-total').innerText = (totalPaid + totalPending) + ' TL';
        }

        function togglePaymentStatus(id) {
            var payments = getData('payments', defaultPayments);
            var payment = payments.find(function(p) { return p.id === id; });
            if (payment) {
                payment.status = payment.status === 'Ödendi' ? 'Bekliyor' : 'Ödendi';
                saveData('payments', payments);
                loadPayments();
            }
        }

        function deletePayment(id) {
            if (confirm('Bu ödeme kaydını silmek istediğinize emin misiniz?')) {
                var payments = getData('payments', defaultPayments).filter(function(p) { return p.id !== id; });
                saveData('payments', payments);
                loadPayments();
            }
        }

        function openPaymentModal() {
            var studentName = prompt("Öğrenci Adı Soyadı:");
            var amount = prompt("Tutar (TL):");
            var date = prompt("Tarih (YYYY-AA-GG):");
            var status = confirm("Ödeme alındı mı? (Tamam = Ödendi, İptal = Bekliyor)") ? "Ödendi" : "Bekliyor";

            if (studentName && amount) {
                var payments = getData('payments', defaultPayments);
                payments.push({ id: Date.now(), studentName: studentName, amount: Number(amount), date: date || '2023-10-10', status: status });
                saveData('payments', payments);
                loadPayments();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
